# Configuración común del sistema multiagente.
# Las configuraciones del experimento (1–7) se arman con estos flags; ver orquestador.py.

modelo: gemini-3.8-flash      # la línea base de producción es 3.6; hay que re-correrla con este modelo
temperatura: 0.0
k: 1                          # fotogramas para A1; k=1 usa data/good_whiteboard/ (la pizarra del paper)

agentes:
  a2: true                    # narración
  c2: true                    # reglas de convención en código
  a4: true                    # crítico (solo corre si C3 o C2 avisan)

max_llamadas: 30              # tope de llamadas NUEVAS por ejecución; la caché no cuenta

rutas:
  pizarras: data/good_whiteboard
  top_k: whiteboard_selection_lab/lab_workspace   # <vid>/top10/rank_NN_*.jpg, solo para k > 1
  transcripciones: data/raw
  ground_truth: data/cloudscape_gt
  salida: reports/multiagente
  cache: reports/multiagente/cache
  log: reports/multiagente/llamadas.jsonl
